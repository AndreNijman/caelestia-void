# User Hyprland variable overrides — sourced after Caelestia's variables.conf,
# before env.conf/execs.conf. Safe to edit; never overwritten by updates.

# Modern black cursor (Bibata) instead of the default
$cursorTheme = Bibata-Modern-Classic
$cursorSize = 24

# Workspace switching: 3-finger swipe (was 4)
$workspaceSwipeFingers = 3

# Square window corners (no rounding)
$windowRounding = 0

# No gaps/spacing — windows edge to edge
$workspaceGaps = 0
$windowGapsIn = 0
$windowGapsOut = 0
$singleWindowGapsOut = 0

# Disable window transparency (fully opaque)
$windowOpacity = 1
