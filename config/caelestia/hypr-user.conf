# User Hyprland config — sourced last by Caelestia's hyprland.conf.
# Safe to edit; never overwritten by Caelestia dotfile updates.

# --- Void Linux session bring-up (no systemd user session) ---
# Export the session environment to the D-Bus activation environment so
# dbus-activated services (xdg-desktop-portal etc.) inherit WAYLAND_DISPLAY.
exec-once = dbus-update-activation-environment --all

# Audio stack — on Void these are not started by systemd user services,
# so launch them with the graphical session.
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber

# --- Dynamic cursors plugin (hypr-dynamic-cursors) ---
plugin = /usr/lib/hyprland-plugins/dynamic-cursors.so

plugin:dynamic-cursors {
    enabled = true
    # tilt = lean the cursor based on movement speed (realistic feel)
    mode = tilt
    threshold = 2
}

# --- App launcher on Alt+Space (replaces tap-Super) ---
unbind = Super, Super_L
bind = Alt, Space, global, caelestia:launcher

# --- Claude Desktop special workspace (Super+Shift+F23 — Copilot key) ---
bind = Super+Shift, F23, exec, caelestia toggle claude
windowrule = workspace special:claude, match:class claude

# --- Put ~/.local/bin on PATH for the whole session (foot uses fish, which
#     doesn't read ~/.bashrc where the original PATH line lives) ---
env = PATH,/home/andre/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin

# --- Qt apps use qt6ct (env.conf points at non-existent 'qtengine') ---
env = QT_QPA_PLATFORMTHEME,qt6ct

# --- Monitor scaling: 1.0 — fractional downscale (<1) breaks Electron apps
#     (Discord/Claude render at 1x and don't fill the scaled window) ---
monitor = eDP-1, preferred, auto, 1
